      - size: small
        widgets:

  - name: Server
    width: wide
    columns:
      - size: small
        widgets:
          - type: bookmarks
            groups:
              - title: Services
                links:
                  - title: Sonarr
                    url: http://sonarr.winston-server.com
                  - title: Radarr
                    url: http://radarr.winston-server.com
                  - title: Pihole
                    url: http://pihole.winston-server.com/admin

      - size: full
