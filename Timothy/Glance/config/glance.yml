pages:
  - name: Home
    width: wide
    columns:
      - size: small
        widgets:
          !include: ./f1_extensions/f1_next_race.yml

          - type: group
            widgets:
              !include: ./f1_extensions/f1_drivers_championship.yml
              !include: ./f1_extensions/f1_constructors_championship.yml

          - type: group
            widgets:
              - type: reddit
                cache: 1h
                subreddit: formula1
                style: vertical-cards
                limit: 3

      - size: full
        widgets:
          - type: search
            title: " "
            search-engine: google
            autofocus: true

          - type: bookmarks
            title: " "
            groups:
              - title: General
                links:
                  - title: Github
                    url: https://github.com/
                    same-tab: true
                  - title: Amazon
                    url: https://www.amazon.ca/
                    same-tab: true
                  - title: Movie Rankings
                    url: https://docs.google.com/spreadsheets/d/1d-YPy20QbiuzhKRq7IFGd5rfE0Iq9imoFgyNbzKo1uc/edit?usp=sharing
                    same-tab: true
                  - title: Drive Health
                    url: http://192.168.0.92:8020/web/dashboard
                    same-tab: true
              - title: Entertainment
                links:
                  - title: Plex
                    url: https://app.plex.tv/desktop/#!/
                    same-tab: true
                  - title: YouTube
                    url: https://www.youtube.com/
                    same-tab: true
              - title: Social
                links:
                  - title: Reddit
                    url: https://old.reddit.com/
                    same-tab: true
                  - title: Twitter
                    url: https://x.com/home
                    same-tab: true
          - type: split-column
            max-columns: 4
            widgets:
              !include: ./tautulli/recently_watched.yml
                options:
                  size: "small"

              !include: ./tautulli/recently_added.yml
                options:
                  size: "small"
              - type: group
                widgets:
                  !include: ./tautulli/top_shows.yml
                    options: 
                      size: "small"
                  !include: ./tautulli/top_movies.yml
                    options: 
                      size: "small"
                  !include: ./tautulli/top_users.yml
                    options:
                      size: "small"
                  !include: ./tautulli/top_platforms.yml
                    options:
                      size: "small"
                      filter: "brightness(0) saturate(100%) invert(75%) sepia(73%) saturate(5%) hue-rotate(161deg) brightness(93%) contrast(96%)"


          - type: group
            widgets:
              - type: reddit
                cache: 2h
                limit: 3
                subreddit: edmonton
                show-thumbnails: true
              - type: reddit
                cache: 2h
                limit: 3
                subreddit: alberta
                show-thumbnails: true
              - type: reddit
                cache: 2h
                limit: 3
                subreddit: homelab
                show-thumbnails: true
              - type: reddit
                cache: 2h
                limit: 3
                subreddit: movies
                show-thumbnails: true

      - size: small
        widgets:
          !include: ./tautulli/now_playing.yml
          - type: custom-api
            title: " "
            url: http://uptime.winston-server.com/api/status-page/services
            subrequests:
              heartbeats:
                url: http://uptime.winston-server.com/api/status-page/heartbeat/services
            cache: 10m
            template: |
              {{ $hb := .Subrequest "heartbeats" }}

              {{ if not (.JSON.Exists "publicGroupList") }}
              <p class="color-negative">Error reading response</p>
              {{ else if eq (len (.JSON.Array "publicGroupList")) 0 }}
              <p>No monitors found</p>
              {{ else }}

              <ul class="dynamic-columns list-gap-8">
                {{ range .JSON.Array "publicGroupList" }}
                {{ range .Array "monitorList" }}
                {{ $id := .String "id" }}
                {{ $hbArray := $hb.JSON.Array (print "heartbeatList." $id) }}
                {{ $latest := index $hbArray (toInt (sub ((len $hbArray) | toFloat) 1)) }}
                <div class="flex items-center gap-12">
                  <a class="size-title-dynamic color-highlight text-truncate block grow" href="http://uptime.winston-server.com/dashboard/{{ $id }}"
                    target="_blank" rel="noreferrer">
                    {{ .String "name" }} </a>
                  {{ if eq ($latest.Int "status") 1 }}
                  <div>{{ $latest.Int "ping" }}ms</div>
                  <div class="monitor-site-status-icon-compact" title="OK">
                    <svg fill="var(--color-positive)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                      <path fill-rule="evenodd"
                        d="M10 18a8 8 0 1 0 0-16 8 8 0 0 0 0 16Zm3.857-9.809a.75.75 0 0 0-1.214-.882l-3.483 4.79-1.88-1.88a.75.75 0 1 0-1.06 1.061l2.5 2.5a.75.75 0 0 0 1.137-.089l4-5.5Z"
                        clip-rule="evenodd"></path>
                    </svg>
                  </div>
                  {{ else }}
                  <div><span class="color-negative">DOWN</span></div>
                  <div class="monitor-site-status-icon-compact" title="{{ if $latest.Exists " msg" }}{{ $latest.String "msg" }}{{ else
                    }}Error{{ end }}">
                    <svg fill="var(--color-negative)" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
                      <path fill-rule="evenodd"
                        d="M8.485 2.495c.673-1.167 2.357-1.167 3.03 0l6.28 10.875c.673 1.167-.17 2.625-1.516 2.625H3.72c-1.347 0-2.189-1.458-1.515-2.625L8.485 2.495ZM10 5a.75.75 0 0 1 .75.75v3.5a.75.75 0 0 1-1.5 0v-3.5A.75.75 0 0 1 10 5Zm0 9a1 1 0 1 0 0-2 1 1 0 0 0 0 2Z"
                        clip-rule="evenodd"></path>
                    </svg>
                  </div>
                  {{ end }}
                </div>
                {{ end }}
                {{ end }}
              </ul>
              {{ end }}

          - type: weather
            location: Edmonton, Canada
            units: metric # alternatively "imperial"
            hour-format: 12h # alternatively "24h"
            title: " "
            hide-location: true

          - type: markets
            cache: 5m
            title: " "
            markets:
              - symbol: VEQT.TO
                name: Vanguard Total World Equity
              - symbol: VFV.TO
                name: Vanguard S&P 500
              - symbol: TEC.TO
                name: TD Technology ETF

          - type: twitch-channels
            cache: 5m
            title: " "
            collapse-after: 3
            channels:
              - Northernlion
              - shxtou
              - sleepy
              - birlap
              - Squeex
              - p4perback
              - WhatAboutAndy



