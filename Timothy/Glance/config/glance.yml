         - type: releases
           repositories:
            - linuxserver/docker-plex
            - glanceapp/glance
            - pi-hole/pi-hole

  - name: Tautulli
    width: wide
    columns:
      - size: small
        widgets:
          !include: ./tautulli/now_playing.yml

          !include: ./tautulli/recently_added.yml
            options:
              size: small

          !include: ./tautulli/top_users.yml
            options: 
              size: "small"
          
          !include: ./tautulli/recently_watched.yml
            options: 
              size: "small"

          !include: ./tautulli/top_platforms.yml
            options:
              size: "small"
              filter: "brightness(0) saturate(100%) invert(75%) sepia(73%) saturate(5%) hue-rotate(161deg) brightness(93%) contrast(96%)"
          
      - size: full
        widgets:
          !include: ./tautulli/recently_added.yml
            options:
              size: "large"

          !include: ./tautulli/top_users.yml 
            options:
              size: "large"

          !include: ./tautulli/top_platforms.yml
            options:
              size: "large"
              filter: "brightness(0) saturate(100%) invert(75%) sepia(73%) saturate(5%) hue-rotate(161deg) brightness(93%) contrast(96%)"

          !include: ./tautulli/recently_watched.yml
            options:
              size: "large"

          !include: ./tautulli/top_movies.yml
            options: 
              size: "large"

          !include: ./tautulli/top_shows.yml
            options: 
              size: "large"

      - size: small
        widgets:
          !include: ./tautulli/top_movies.yml
            options: 
              size: "small"

          !include: ./tautulli/top_shows.yml
            options: 
              size: "small"

